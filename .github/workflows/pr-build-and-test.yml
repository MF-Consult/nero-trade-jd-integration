name: Build and test (PR)

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup DotNet ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore NeroTrade.JDIntegration.sln

      - name: Build
        # Must build the full solution — both test steps below rely on --no-build.
        run: dotnet build NeroTrade.JDIntegration.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test NeroTrade.JDIntegration.Tests/NeroTrade.JDIntegration.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Test Uniconta plugin
        run: dotnet test NeroTrade.UnicontaPlugin.Tests/NeroTrade.UnicontaPlugin.Tests.csproj --configuration Release --no-build --verbosity normal
