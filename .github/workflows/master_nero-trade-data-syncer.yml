# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy dotnet core project to Azure Function App - nero-trade-data-syncer

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.' # set this to the path to your web app project, defaults to the repository root
  DOTNET_VERSION: '9.0' # set this to the dotnet version to use

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 'Run unit tests'
        # Run the test project before publishing so a regression in the cache / repository / classifier
        # contract blocks deploy rather than getting noticed in prod next time JD hiccups.
        shell: bash
        run: dotnet test NeroTrade.JDIntegration.Tests/NeroTrade.JDIntegration.Tests.csproj --configuration Release --verbosity normal

      - name: 'Build Azure Functions project'
        shell: bash
        run: |
          # Build the function project specifically (not the .sln) so the deploy package doesn't
          # accidentally include the test assemblies. Matches the original `dotnet build` semantics
          # the deploy step was wired against.
          dotnet build NeroTrade.JDIntegration/NeroTrade.JDIntegration.csproj --configuration Release --output ./output
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2BED7C10F8FE48DA99D7149F75A8A92E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F5278825B59648C68081CF046BB5E62E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A64206C6107044D8B6D77B59D8A74153 }}

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'nero-trade-data-syncer'
          slot-name: 'Production'
          package: '${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/output'
          